<!doctype html>
<!-- The start screen (main.js opens it in "auto" mode, the default): your name, PLAY (matchmaking over Steam, all
     player-hosted), host a game, join a friend with the code they sent (or an address), the games found on the
     network and on Steam, or play offline. -->
<html>
<head>
<meta charset="utf-8">
<title>Krunker</title>
<style>
@font-face { font-family: 'GameFont'; src: url('krunkerio/css/fonts/font2.ttf'); }
* { box-sizing: border-box; font-family: 'GameFont', sans-serif; }
body { margin: 0; background: #16161d; color: #fff; user-select: none; overflow: hidden; }
.wrap { padding: 16px 26px; height: 100vh; display: flex; flex-direction: column; gap: 10px; }
h1 { margin: 0; font-size: 36px; letter-spacing: 2px; font-weight: normal; }
h1 span { color: #F44336; }
.steam { font-size: 15px; color: rgba(255,255,255,0.55); margin-top: -10px; }
.steam.off { color: #ffb74d; }
.row { display: flex; gap: 10px; align-items: center; }
label { font-size: 17px; color: rgba(255,255,255,0.6); }
label.l { width: 52px; }
input, select { font-size: 19px; padding: 7px 11px; border: none; border-radius: 4px; background: #fff; color: #222; user-select: text; }
input.name { width: 220px; }
.btn { font-size: 24px; padding: 10px 24px; border-radius: 4px; cursor: pointer; background: #2196F3; text-align: center; }
.btn:hover { filter: brightness(1.15); }
.btn.red { background: #F44336; }
.btn.green { background: #43a047; }
.btn.play { font-size: 32px; padding: 10px 0; width: 100%; }
.btn.small { font-size: 17px; padding: 6px 16px; }
.btn.busy { opacity: 0.5; pointer-events: none; }
.box { background: rgba(255,255,255,0.05); border-radius: 6px; padding: 12px 14px; }
.box h2 { margin: 0 0 8px; font-size: 21px; font-weight: normal; }
.hint { font-size: 14px; color: rgba(255,255,255,0.45); margin-top: 6px; }
input.code { flex: 1; min-width: 0; font-size: 21px; letter-spacing: 1px; }
.msg { font-size: 16px; min-height: 20px; color: rgba(255,255,255,0.7); }
.msg.err { color: #ff6b6b; }
.games { flex: 1; overflow-y: auto; min-height: 150px; }
.game { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 18px; }
.game .what { flex: 1; }
.game .sub { color: rgba(255,255,255,0.45); font-size: 15px; }
.tag { font-size: 13px; padding: 2px 7px; border-radius: 3px; background: #2a475e; color: #c7d5e0; margin-right: 6px; }
.tag.lan { background: #3b5d3b; color: #cfe8cf; }
.empty { color: rgba(255,255,255,0.4); font-size: 16px; padding: 6px 2px; }
.offline { font-size: 15px; color: rgba(255,255,255,0.45); cursor: pointer; text-align: right; }
.offline:hover { color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>KRUNKER <span>1.5.6</span></h1>
  <div class="steam" id="steam">Looking for Steam...</div>
  <div class="row">
    <label class="l">Name</label><input class="name" id="name" maxlength="16" spellcheck="false">
  </div>
  <div class="row">
    <label class="l">Mode</label><select id="mode"></select>
    <label style="margin-left:10px">Map</label><select id="map"></select>
  </div>

  <div class="row" style="gap:12px; align-items:stretch">
    <div class="box" style="flex:1.1">
      <div class="btn red play" id="play">PLAY</div>
      <div class="hint">Joins a game in this mode on Steam, or starts one that others join. <span id="hostlink" style="color:#8fd0ff;cursor:pointer">Host your own instead</span></div>
    </div>
    <div class="box" style="flex:1">
      <h2>Join a friend</h2>
      <div class="row"><input class="code" id="code" placeholder="Paste their code" spellcheck="false"><div class="btn green" id="join">JOIN</div></div>
    </div>
  </div>
  <div class="msg" id="msg"></div>

  <div class="box games">
    <h2>Games you can join</h2>
    <div id="games"><div class="empty">Searching...</div></div>
  </div>
  <div class="offline" id="offline">Play offline</div>
</div>
<script>
const { ipcRenderer, clipboard } = require('electron')
const $ = id => document.getElementById(id)
const MAPS = ['burg', 'littletown', 'sandstorm', 'subzero', 'kanji']
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
let busy = false

$('map').innerHTML = MAPS.map(m => `<option value="${m}">${m[0].toUpperCase() + m.slice(1)}</option>`).join('')
const msg = (text, err) => { $('msg').textContent = text || ''; $('msg').classList.toggle('err', !!err) }

// a code a friend sent, already copied: fill it in
const looksLikeCode = t => /^(steam:)?[0-9a-z]{6,13}$/i.test(t) || /^[\w.-]+\.[\w.-]+(:\d+)?$/.test(t)
try { const t = clipboard.readText().trim(); if (t && t.length < 60 && looksLikeCode(t)) $('code').value = t } catch (e) { }

function go(action, target) {
  if (busy) return
  if (action === 'join' && !target) return msg('Paste the code your friend sent you first.', true)
  busy = true
  document.querySelectorAll('.btn').forEach(b => b.classList.add('busy'))
  msg(action === 'join' ? 'Joining...' : action === 'play' ? 'Looking for a game...' : 'Starting...')
  ipcRenderer.send('krLaunch', { action, name: $('name').value.trim(), map: $('map').value, mode: Number($('mode').value), target })
}
$('play').onclick = () => go('play')
$('hostlink').onclick = () => go('host')
$('join').onclick = () => go('join', $('code').value.trim())
$('code').onkeydown = e => { if (e.key === 'Enter') go('join', $('code').value.trim()) }
$('offline').onclick = () => go('offline')
$('games').onclick = e => { const b = e.target.closest('[data-target]'); if (b) go('join', b.dataset.target) }

ipcRenderer.on('krLauncher', (e, info) => {
  if (info.name != null && !$('name').value) $('name').value = info.name
  if (info.map && !$('map').dataset.set) { $('map').value = info.map; $('map').dataset.set = 1 }
  if (info.modes) { $('mode').innerHTML = info.modes.map((m, i) => `<option value="${i}">${esc(m)}</option>`).join(''); $('mode').value = info.mode || 0 }
  if (info.steam != null) {
    $('steam').textContent = info.steam ? `Steam: on, as ${info.steam}` : "Steam isn't running - open Steam and restart the game to play with people over the internet."
    $('steam').classList.toggle('off', !info.steam)
  }
  if (info.status) msg(info.status)
  if (info.error) {   // joining failed: try again
    busy = false
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('busy'))
    msg(info.error, true)
  }
  if (info.games) {
    $('games').innerHTML = info.games.length ? info.games.map(g => `<div class="game"><div class="what">` +
      `<span class="tag${g.steam ? '' : ' lan'}">${g.steam ? 'STEAM' : 'LAN'}</span>${esc(g.name)}` +
      `<div class="sub">${esc(g.map)}${g.mode ? ' · ' + esc(g.mode) : ''} · ${g.players} playing</div></div>` +
      `<div class="btn green small" data-target="${esc(g.target)}">JOIN</div></div>`).join('')
      : `<div class="empty">None found yet - still looking. Games hosted on your network or on Steam show up here.</div>`
  }
})
ipcRenderer.send('krLauncherReady')
</script>
</body>
</html>
